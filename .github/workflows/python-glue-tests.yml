name: Python glue tests

on:
  push:
    branches: [workflow-dev]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v
